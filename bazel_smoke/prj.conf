# Phase-1 Bazel smoke test — minimal board bring-up config.
CONFIG_GEN_ISR_TABLES=y
CONFIG_BUILD_OUTPUT_HEX=y
CONFIG_ARM_MPU=y
CONFIG_HW_STACK_PROTECTION=y
CONFIG_WDT_DISABLE_AT_BOOT=y

# xiao_ble routes zephyr,console to the USB CDC uart, which the USB-disable
# below removes — leaving uart_console with an undefined console device
# ordinal. The smoke app only needs to *link* an nRF52840 image, not print, so
# no console backend is wired here. (Phase 3's real app uses the USB CDC
# console, wired once the USB device_next gaps are fixed.)
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_SERIAL=y

# The xiao_ble board DTS enables zephyr_udc0, which defaults CONFIG_UDC_NRF=y
# and pulls in drivers/usb/udc/udc_nrf.c. That driver #includes
# <nrf_usbd_common.h>, whose zephyr-bazel target the generated udc BUILD does
# not depend on — a USB-coverage gap fixed in Phase 3 (the real transport_usb.c
# wiring). The smoke app needs no USB, so turn the driver off here.
CONFIG_UDC_NRF=n

# The xiao_ble board enables the whole USB device stack by default. On
# zephyr-bazel the USB device_next subsys has several coverage gaps that only
# bite at link/compile time — Phase 3 (real transport_usb.c) must fix them:
#   - drivers/usb/udc udc_nrf.c needs <nrf_usbd_common.h> (no dep wired)
#   - drivers/serial pulls a literal "${ZEPHYR_BASE}/misc/empty_file.c" for
#     CONFIG_USB_CDC_ACM / USBD_CDC_ACM_CLASS (converter bug)
#   - subsys/usb/device_next + drivers/usb/common/buf need net_buf, which is
#     not linked -> undefined net_buf_* at link time
# The smoke app needs no USB, so turn the whole stack off (this subsumes the
# UDC/CDC disables above).
CONFIG_USB_DEVICE_STACK_NEXT=n
CONFIG_USB_CDC_ACM=n
CONFIG_USBD_CDC_ACM_CLASS=n
