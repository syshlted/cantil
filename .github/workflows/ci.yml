# SPDX-License-Identifier: GPL-3.0-or-later
#
# Blocking CI: the same checks as lefthook (pre-commit lint, build + test),
# run somewhere nobody can skip them. Scanners and anything slow or noisy
# live in security.yml.
#
# Actions are pinned by commit SHA (the tag is in the trailing comment);
# dependabot (.github/dependabot.yml) bumps them.

name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Runs lefthook's own pre-commit config over the files this push/PR
  # touches, so local and CI checks cannot drift apart. Changed files only:
  # the tree carries pre-existing lint debt (see docs/open-questions.md) that
  # a whole-tree run would report on day one. The soft reset makes the diff
  # look staged, which is what every lefthook job here keys off.
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: Install lint tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cppcheck
          pip install \
            "lefthook==2.1.14" \
            "clang-format==$(cat .clang-format-version)" \
            shellcheck-py ruff
          # buildtools' go.mod path breaks `go install` at this tag, so fetch
          # the release binary and verify it against a pinned digest.
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o "$HOME/.local/bin/buildifier" \
            https://github.com/bazelbuild/buildtools/releases/download/v8.5.1/buildifier-linux-amd64
          echo "887377fc64d23a850f4d18a077b5db05b19913f4b99b270d193f3c7334b5a9a7  $HOME/.local/bin/buildifier" | sha256sum -c -
          chmod +x "$HOME/.local/bin/buildifier"
          # gitleaks' go.mod still declares its pre-move module path.
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Stage the changed files
        id: stage
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          base="${PR_BASE:-$PUSH_BASE}"
          # A new branch has an all-zero "before"; fall back to the parent.
          case "$base" in ""|0000000000000000000000000000000000000000)
            base="$(git rev-parse --verify -q HEAD~1 || true)" ;; esac
          # No base to diff against: a root commit, or a force-push whose
          # old tip is not an ancestor of the new one. Nothing to ratchet
          # against, so skip rather than lint the whole tree.
          if [ -z "$base" ] || ! git merge-base --is-ancestor "$base" HEAD; then
            echo "::notice::no comparable base commit; skipping changed-file lint"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git reset --soft "$base"
          git diff --cached --name-only
      - name: lefthook pre-commit
        if: steps.stage.outputs.skip != 'true'
        run: lefthook run pre-commit

  # REUSE 3.3: every file has a license and copyright, every license used has
  # its text in LICENSES/. Files that cannot carry a header are covered by
  # REUSE.toml.
  reuse:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install "reuse==6.2.0"
      - run: reuse lint

  # scripts/build.sh and test.sh are what a developer runs, so CI runs them
  # too. Bazel fetches Zephyr, the Zephyr SDK and the modules itself.
  build-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # 0.19.1
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true
      - name: Host packages (system OpenSSL for libcantil and the DER gates)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libssl-dev openssl libsodium-dev
      - name: Build firmware and check ELF invariants
        run: sh scripts/build.sh
      - name: ztest suites, OpenSSL gates, pin agreement
        run: sh scripts/test.sh
      - name: Host client
        run: bazelisk test //libcantil/... --config=host
      - name: Locate the UF2
        run: |
          uf2="$(bazelisk cquery //firmware:cantil.uf2 --config=xiao \
            --output=files 2>/dev/null | tail -1)"
          mkdir -p out && cp -L "$(bazelisk info execution_root)/$uf2" out/
          sha256sum out/*.uf2
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cantil-uf2
          path: out/*.uf2
          if-no-files-found: error
