# Seeed Studio XIAO BLE Sense — factory image.
#
# Only what is needed to reach the QSPI part and report what happened. The
# production board .conf additionally brings up USB, PWM/LED, GPIO tap input,
# I2C and the CA stack; none of that is wanted here.

# LittleFS lives on the external QSPI part (cantil_storage node in the
# shared overlay), not on internal flash.
CONFIG_CANTIL_STORAGE_EXTERNAL=y

# External QSPI flash — hardware configured by board DTS; enable drivers
# explicitly, matching the production board .conf.
CONFIG_FLASH=y
CONFIG_NORDIC_QSPI_NOR=y
CONFIG_NORDIC_QSPI_NOR_FLASH_LAYOUT_PAGE_SIZE=4096
CONFIG_MPU_ALLOW_FLASH_WRITE=y

# USB CDC/ACM console, so the bench operator can read the result over the
# same cable used to flash. The shared overlay points zephyr,console at
# cdc_acm_uart1 (the second CDC port).
#
# Exactly the two symbols the production board .conf sets, and no more.
# Adding CONFIG_USB_DEVICE_STACK on top pulls in the device_next stack
# alongside the legacy one and both compile a CDC ACM class for the same
# devicetree nodes, which fails at link with duplicate __device_dts_ord_*.
# USB_DEVICE_INITIALIZE_AT_BOOT, set by the board dtsi, handles enumeration.
CONFIG_USB_CDC_ACM=y
CONFIG_UART_LINE_CTRL=y
