# Step-1 factory image.
#
# Deliberately minimal: flash, LittleFS, CRC, logging. No crypto stack, no
# transport, no gesture, no CA. This is the only image that carries
# lfs_format, so its surface area is kept as small as it can be.

CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_LITTLEFS=y
CONFIG_FS_LITTLEFS_FMP_DEV=y

# The whole point of this image. Production sets this to n.
CONFIG_FILE_SYSTEM_MKFS=y

# crc32_ieee, for the volume identity marker's integrity field
CONFIG_CRC=y

CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3

# RTT log backend — emits over SWD even with no USB console attached.
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=8192

# Status LED feedback via the generic LED API (led.h) on the board's gpio-leds
# — so a bench operator sees the result (green=done, red=refused/failed) without
# a console attached. The app overlay reverts the RGB pins from PWM to gpio-leds.
CONFIG_GPIO=y
CONFIG_LED=y
CONFIG_LED_GPIO=y
# Only the gpio-led backend; the PWM LED driver would try to bind the RGB pins'
# now-disabled pwm0 and fails to link.
CONFIG_LED_PWM=n

CONFIG_REBOOT=y
