# ztest framework
CONFIG_ZTEST=y

# Inject Noise static + ephemeral keypairs from a precomputed vector so the
# responder's wire output is bit-deterministic against the reference trace.
CONFIG_CANTIL_TEST_INJECT_NOISE_KEYS=y

# Entropy needed by the wolfCrypt RNG (used internally even when
# we never call noise_crypto_dh_keygen directly).
CONFIG_ENTROPY_GENERATOR=y
CONFIG_TEST_RANDOM_GENERATOR=y


CONFIG_MAIN_STACK_SIZE=8192
CONFIG_HEAP_MEM_POOL_SIZE=16384

# wolfCrypt — primitives selected by the settings header, not Kconfig.
CONFIG_WOLFSSL=y
CONFIG_WOLFSSL_BUILTIN=y
CONFIG_WOLFSSL_SETTINGS_FILE="cantil_wolfssl_user_settings.h"
