# ztest framework
CONFIG_ZTEST=y

# noise_crypto_dh_keygen() draws from the Zephyr entropy device, and
# wolfCrypt's curve25519 blinding opens an RNG of its own from inside
# wc_curve25519_generic().
CONFIG_ENTROPY_GENERATOR=y
CONFIG_TEST_RANDOM_GENERATOR=y

# wolfCrypt.  Which primitives get compiled is decided by the settings header,
# not by Kconfig — see firmware/include/cantil_wolfssl_user_settings.h.
CONFIG_WOLFSSL=y
CONFIG_WOLFSSL_BUILTIN=y
CONFIG_WOLFSSL_SETTINGS_FILE="cantil_wolfssl_user_settings.h"

CONFIG_MAIN_STACK_SIZE=8192
CONFIG_HEAP_MEM_POOL_SIZE=16384
