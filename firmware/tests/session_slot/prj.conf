# ztest framework
CONFIG_ZTEST=y

# Slot count must match the production default.
CONFIG_CANTIL_MAX_KEY_SLOTS=8

# Entropy — native_sim has zephyr,native-posix-rng.
CONFIG_ENTROPY_GENERATOR=y
CONFIG_TEST_RANDOM_GENERATOR=y

# Device-id source for the FICR-derived CN (falls back to "Cantil" if absent).
CONFIG_HWINFO=y

# wolfCrypt — CA path (ECDSA P-256, AES-256-GCM, HKDF-SHA256), the X.509 writer
# and reader, and the Noise primitives session_slot.c pulls via
# noise_crypto_wolfssl.c (X25519 / ChaCha20-Poly1305 / SHA-256). Which
# primitives get compiled is decided by the settings header, not by Kconfig —
# see cantil_wolfssl_user_settings.h.
CONFIG_WOLFSSL=y
CONFIG_WOLFSSL_BUILTIN=y
CONFIG_WOLFSSL_SETTINGS_FILE="cantil_wolfssl_user_settings.h"

# LittleFS on the sim flash partition (storage_partition enlarged by overlay).
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_LITTLEFS=y
CONFIG_FS_LITTLEFS_FMP_DEV=y
CONFIG_FILE_SYSTEM_MKFS=y

CONFIG_MAIN_STACK_SIZE=16384
CONFIG_HEAP_MEM_POOL_SIZE=32768

# crc32_ieee — storage.c volume identity marker
CONFIG_CRC=y
