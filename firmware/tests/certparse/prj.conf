# certparse — the X.509 reader seam against wolfCrypt.
#
# The fixtures are static DER blobs from libcantil/tests, so this suite needs
# no storage, no CA and no certificate writer: it links certparse_wolfssl.c and
# nothing else of Cantil's.
CONFIG_ZTEST=y

# Entropy — native_sim has zephyr,native-posix-rng. Nothing here consumes it,
# but wc_rand.c's CUSTOM_RAND_GENERATE_BLOCK seam opens the device.
CONFIG_ENTROPY_GENERATOR=y
CONFIG_TEST_RANDOM_GENERATOR=y

# wolfCrypt. Which primitives get compiled is decided by the settings header,
# not by Kconfig — see firmware/include/cantil_wolfssl_user_settings.h.
CONFIG_WOLFSSL=y
CONFIG_WOLFSSL_BUILTIN=y
CONFIG_WOLFSSL_SETTINGS_FILE="cantil_wolfssl_user_settings.h"

CONFIG_MAIN_STACK_SIZE=16384
CONFIG_HEAP_MEM_POOL_SIZE=32768
