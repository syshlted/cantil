# Release overlay: production hardening on top of xiao_ble_nrf52840_sense.conf.
# Build with: west build -b xiao_ble/nrf52840/sense -- -DFILE_SUFFIX=release
#
# This used to be the mcuboot tier's release overlay — it set
# CONFIG_BOOTLOADER_MCUBOOT=y (chain-loaded image, shifted ROM offset) and
# CONFIG_BUILD_OUTPUT_UF2=n (the deploy artifact was merged.hex, not a UF2).
# Both went with the tier on 2026-07-26 (docs/roadmap/wolfboot-migration.md),
# so a release image is now a UF2 like any other and carries no signature, no
# rollback protection and no A/B slots. That is the honest state of things:
# there is no supported production bootloader tier until wolfBoot lands.
#
# What remains here is the part that was never about the bootloader:

# Reject (enter recovery mode) if the stored session identity cert no longer
# matches the build-time constant (transport + pairing T-03).
CONFIG_CANTIL_SESSION_X509_STRICT=y
