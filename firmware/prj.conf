# Crypto backend: wolfCrypt (CONFIG_CANTIL_CRYPTO_BACKEND_WOLFSSL, always on;
# see Kconfig). It backs both the CA path (ECDSA P-256 RFC 6979, AES-256-GCM,
# HKDF-SHA256, X.509 write + read) and the Noise_XX primitives (X25519,
# ChaCha20-Poly1305, SHA-256). Which primitives compile is decided entirely by
# firmware/include/cantil_wolfssl_user_settings.h, pointed at by
# CONFIG_WOLFSSL_SETTINGS_FILE — not by Kconfig knobs. The FREE (in-tree
# mbedTLS) backend was removed at the end of docs/roadmap/wolfssl-migration.md.
CONFIG_WOLFSSL=y
CONFIG_WOLFSSL_BUILTIN=y

# TRNG — Zephyr entropy device (CC310 hardware) feeds wolfCrypt's RNG directly
# via CUSTOM_RAND_GENERATE_BLOCK (src/crypto/wc_rand.c). No DRBG layer.
CONFIG_ENTROPY_GENERATOR=y

# LittleFS — FMP_DEV enables the flash-map-partition backend
CONFIG_FLASH_MAP=y
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_LITTLEFS=y
CONFIG_FS_LITTLEFS_FMP_DEV=y

# Production cannot create a filesystem. With this off, Zephyr compiles out
# fs_mkfs() and the littlefs backend's mkfs op, so no bug, error path, or
# compromised command handler can format the volume holding an unexportable
# CA key — the entry point is absent from the binary, not merely unreachable.
# storage.c derives CANTIL_STORAGE_MAY_FORMAT from this symbol and, when it is
# off, also sets FS_MOUNT_FLAG_NO_FORMAT so the mount-time format path inside
# littlefs_mount() is closed at the same time. Creating the volume is the job
# of the step-1 factory image (firmware/factory/), which is the only Cantil
# build that sets this to y.
#
# firmware/CMakeLists.txt asserts on the linked ELF that this actually held.
CONFIG_FILE_SYSTEM_MKFS=n

# crc32_ieee, for the volume identity marker's integrity field
CONFIG_CRC=y

# Logging
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3

# RTT log backend as fallback — emits over SWD even if USB is broken.
# Requires an SWD probe to read (J-Link / nRF DK as programmer);
# silently a no-op otherwise. Keep CONFIG_LOG_BACKEND_UART=y too
# (default from board) so logs are also available on ACM #1.
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y

# Reboot (used by RESET_DEVICE secure wipe)
CONFIG_REBOOT=y

# Stack sizes.
# The protocol dispatcher AND the boot-time session-identity mint both run on
# the main thread and build a cert live (fill a wolfCrypt Cert, wc_MakeCert +
# wc_SignCert / wc_MakeCertReq over P-256) on top of a ~4 KB response scratch.
#
# 8 KB overflowed the T-05 GET_SESSION_CSR build (mbedTLS) on real hardware and
# 12 KB was a safe margin *for mbedTLS*. The wolfCrypt port raised the ceiling:
# WOLFSSL_SP_NO_MALLOC keeps the P-256 SP intermediates on the stack (by design
# — no heap-alloc failure while the CA key is in RAM), and the Cert struct is
# ~5 KB, so 12 KB now MPU-faults during a fresh-boot session_slot_init() mint —
# first seen on hardware 2026-07-24 (USB never enumerates: the fault kills the
# stack before usbd services EP0). 24 KB clears wolfCrypt cert generation with
# margin; RAM is abundant (~65 KB / 256 KB used). Right-size later via
# CONFIG_THREAD_ANALYZER if RAM ever tightens.
CONFIG_MAIN_STACK_SIZE=24576
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

# USB device stack — usbd_* ("device_next", <zephyr/usb/usbd.h>).
#
# transport_usb.c builds and enables the device from main() (see the file's
# header). The Cantil VID/PID and manufacturer/product strings are declared in
# C there, not in Kconfig; the serial-number string comes from HWINFO (the FICR
# device ID), matching the legacy build's iSerial. USBD_CDC_ACM_CLASS compiles
# the CDC ACM function that backs both the protocol and console CDC nodes; the
# two instances come from devicetree (board DTS + the app overlay).
#
# The legacy stack (usb_enable(), <zephyr/usb/usb_device.h>) was dropped here;
# it is deprecated upstream and was the last thing pinning the tree to v4.3.1
# (docs/roadmap/zephyr-upstream.md).
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_HWINFO=y

# Disable the board's automatic CDC-ACM console device. Because our console is
# a CDC-ACM node, the board defconfig would otherwise pull in
# subsys/usb/device_next/app/cdc_acm_serial.c, which builds its OWN usbd context
# on zephyr_udc0 (Zephyr VID 0x2fe3), enables it at boot, and registers only the
# first CDC instance. That context would seize the controller before
# transport_usb.c's cantil_usbd (VID 0x1209/PID 0x00CA) and expose the console
# CDC only — wrong identity, and no protocol port. transport_usb.c owns the one
# usbd context and registers both CDC instances itself.
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n

CONFIG_PAIRING_TAP_CONFIRM=y
