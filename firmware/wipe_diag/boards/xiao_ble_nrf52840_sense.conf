# XIAO BLE Sense — sparse secure-wipe diagnostic.
#
# Only what is needed to reach the external QSPI part and internal flash. No
# USB, no CA, no crypto, no gesture. The external part holds the LittleFS
# key/cert store in normal operation; here we address it as a raw flash device
# (p25q16h node) and do not mount a filesystem.

CONFIG_FLASH=y
CONFIG_NORDIC_QSPI_NOR=y
CONFIG_NORDIC_QSPI_NOR_FLASH_LAYOUT_PAGE_SIZE=4096
CONFIG_MPU_ALLOW_FLASH_WRITE=y
