# Sparse secure-wipe diagnostic.
#
# Deliberately has NO USB. The log is written to internal flash and retrieved
# via the UF2 bootloader's CURRENT.UF2, so the diagnostic does not depend on
# USB enumeration (which is exactly what is unreliable on the unit under test).
# RTT stays available for a live view if an SWD probe is ever attached.

CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y

# Internal flash (flash0) — the log region at 0xE6000 is written here.
CONFIG_SOC_FLASH_NRF=y

# External QSPI part (p25q16h) — the flash under test.
CONFIG_NORDIC_QSPI_NOR=y
CONFIG_NORDIC_QSPI_NOR_FLASH_LAYOUT_PAGE_SIZE=4096

# Writing internal flash (the log region) from a thread that also runs from it.
CONFIG_MPU_ALLOW_FLASH_WRITE=y

# Optional live view over SWD; harmless with no probe attached.
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_BACKEND_RTT=y

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_REBOOT=y
